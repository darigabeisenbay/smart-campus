<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Campus – Room Availability</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Smart Campus – Room Availability</h1>
    <p class="muted">Room: <strong id="room-label">Room A-101</strong> · fictional demo bookings</p>

    <form id="check-form" novalidate>
      <label>Start
        <input id="start" name="start" type="datetime-local" required maxlength="32">
      </label>
      <label>End
        <input id="end" name="end" type="datetime-local" required maxlength="32">
      </label>
      <button id="check-btn" type="submit">Check availability</button>
    </form>

    <section id="status" class="status hidden" aria-live="polite">
      <div class="status-label">Booking status (from booking rules)</div>
      <div id="status-text" class="status-text"></div>
      <div id="status-code" class="muted small"></div>
    </section>

    <p id="error" class="error hidden" role="alert"></p>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
